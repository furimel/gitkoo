<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(${team.displayName ?: team.name})}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('form', ~{::content})}">
  <th:block th:fragment="content">

    <div class="Subhead">
      <h1 class="Subhead-heading d-flex flex-items-center gap-2">
        <svg class="octicon color-fg-muted" width="16" height="16" aria-hidden="true"><use href="#octicon-people"></use></svg>
        <span th:text="${team.displayName ?: team.name}">Team</span>
      </h1>
      <p class="Subhead-description" th:if="${team.description}" th:text="${team.description}">description</p>
    </div>

    <div class="section">
      <div class="section-title">
        <span>Members</span>
        <span class="Counter" th:text="${#lists.size(members)}">0</span>
      </div>

      <ul class="list" th:unless="${members.isEmpty()}">
        <li class="list-item flex-items-center" th:each="m,iter : ${members}">
          <span th:replace="~{fragments/common :: avatar(${users[iter.index]?.username ?: 'ghost'}, 32)}"></span>
          <a class="flex-auto text-bold" th:href="@{'/@/' + ${users[iter.index]?.username}}"
             th:text="${users[iter.index]?.displayName ?: users[iter.index]?.username ?: 'Unknown'}">user</a>
          <span class="Label"
                th:classappend="${m.role == 'OWNER'} ? ' Label--accent' : ' Label--secondary'"
                th:text="${#strings.toLowerCase(m.role)}">member</span>
        </li>
      </ul>

      <div th:if="${members.isEmpty()}"
           th:replace="~{fragments/ui :: emptyState('people', 'No members yet',
                         'Add someone below to get started.', null)}"></div>
    </div>

    <div th:replace="~{fragments/form :: card('Add a member',
                       @{'/teams/' + ${team.name} + '/members'}, ~{::addMember}, 'Add member')}">
      <div th:fragment="addMember" class="d-flex flex-items-end flex-wrap gap-2">
        <div class="form-group mb-0 flex-auto">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control width-full"
                 required placeholder="username" autocomplete="off">
        </div>
        <div class="form-group mb-0">
          <label for="role">Role</label>
          <select id="role" name="role" class="form-select">
            <option value="MEMBER">Member</option>
            <option value="MAINTAINER">Maintainer</option>
            <option value="OWNER">Owner</option>
          </select>
        </div>
      </div>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
