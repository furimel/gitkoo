<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('New team')}"></head>
<body>
  <header th:replace="~{fragments/common :: header}"></header>
  <div class="container-app max-w-lg">
    <h1 class="mb-4">Create a new team</h1>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <form th:action="@{/teams/new}" method="post">
      <div class="field">
        <label for="name">Team name</label>
        <input type="text" id="name" name="name" class="input" required placeholder="e.g. pump-team">
      </div>
      <div class="field">
        <label for="displayName">Display name (optional)</label>
        <input type="text" id="displayName" name="displayName" class="input" placeholder="Pump Team">
      </div>
      <div class="field">
        <label for="description">Description (optional)</label>
        <input type="text" id="description" name="description" class="input">
      </div>
      <button type="submit" class="btn btn-primary">Create team</button>
    </form>
  </div>
</body>
</html>
