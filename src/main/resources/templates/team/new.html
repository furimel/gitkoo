<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('New team')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('form', ~{::content})}">
  <th:block th:fragment="content">

    <div th:replace="~{fragments/ui :: subhead('Create a new team',
                       'Teams group people so you can grant repository access once.', null)}"></div>

    <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>

    <div th:replace="~{fragments/form :: card(null, @{/teams/new}, ~{::fields}, 'Create team')}">
      <th:block th:fragment="fields">
        <div th:replace="~{fragments/form :: field('name', 'name', 'Team name', null,
                           'e.g. platform', 'Used in URLs. Lowercase, no spaces.',
                           'field-w-md', true, true)}"></div>
        <div th:replace="~{fragments/form :: field('displayName', 'displayName',
                           'Display name (optional)', null, 'Platform Team', null,
                           null, false, false)}"></div>
        <div th:replace="~{fragments/form :: field('description', 'description',
                           'Description (optional)', null,
                           'What this team is responsible for', null, null, false, false)}"></div>
      </th:block>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
