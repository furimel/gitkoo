<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title != null ? title + ' — GitKoo' : 'GitKoo'}">GitKoo</title>
  <link rel="stylesheet" th:href="@{/css/gitkoo.css}">
</head>
<body>
  <nav class="navbar">
    <a th:href="@{/}" class="brand">GitKoo</a>
    <div class="nav-links" sec:authorize="isAuthenticated()">
      <a th:href="@{/}">Dashboard</a>
      <a th:href="@{/logout}">Sign out</a>
    </div>
  </nav>
  <div class="container">
    <div th:fragment="content"></div>
  </div>
</body>
</html>
