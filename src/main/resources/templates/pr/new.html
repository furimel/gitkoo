<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('New pull request - ' + ${owner} + '/' + ${repo.name})}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>
<div th:replace="~{fragments/common :: repoHead(${owner}, ${repo}, 'pulls')}"></div>

<main class="container-lg px-3 mt-4">
  <div class="Subhead">
    <h2 class="Subhead-heading">Open a pull request</h2>
    <p class="Subhead-description">Propose the commits on one branch for merging into another.</p>
  </div>

  <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>

  <form th:action="@{'/' + ${owner} + '/' + ${repo.name} + '/pulls/new'}" method="post">
    <div class="Box mb-3">
      <div class="Box-body d-flex flex-items-center flex-wrap gap-2">
        <svg class="octicon color-fg-muted" width="16" height="16" aria-hidden="true"><use href="#octicon-git-merge"></use></svg>
        <label class="text-bold" for="targetBranch">base:</label>
        <input type="text" id="targetBranch" name="targetBranch" class="form-control input-sm"
               th:value="${repo.defaultBranch}" required style="width:180px">
        <svg class="octicon color-fg-muted" width="16" height="16" aria-hidden="true"><use href="#octicon-arrow-right"></use></svg>
        <label class="text-bold" for="sourceBranch">compare:</label>
        <input type="text" id="sourceBranch" name="sourceBranch" class="form-control input-sm"
               required placeholder="feature-branch" style="width:180px">
      </div>
    </div>

    <div class="Box">
      <div class="Box-body">
        <input type="text" id="title" name="title" class="form-control input-lg width-full mb-3"
               required placeholder="Title" aria-label="Pull request title">
        <textarea id="body" name="body" class="form-control" rows="10"
                  placeholder="Describe the change (Markdown supported)"></textarea>
      </div>
      <div class="Box-footer d-flex flex-justify-end">
        <button type="submit" class="btn btn-primary">Create pull request</button>
      </div>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
