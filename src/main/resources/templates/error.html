<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Spring Boot resolves this for every error status, replacing the whitelabel page.
  Kept generic rather than one template per status: the only thing that differs is
  the wording, and a missing template would drop back to the whitelabel page.
-->
<head th:replace="~{fragments/common :: head(${status} + ' Error')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('narrow', ~{::content})}">
  <div th:fragment="content" class="blankslate blankslate-large">
    <svg class="octicon blankslate-icon color-fg-subtle" width="48" height="48" aria-hidden="true">
      <use th:href="${status == 404} ? '#octicon-repo' : (${status == 403} ? '#octicon-lock' : '#octicon-alert')"></use>
    </svg>

    <h1 class="blankslate-heading f1 text-normal" th:text="${status}">404</h1>

    <p class="f3 color-fg-muted" th:if="${status == 404}">
      This is not the web page you are looking for.
    </p>
    <th:block th:if="${status == 403}">
      <p class="f3 color-fg-muted" sec:authorize="isAuthenticated()">
        You do not have access to this.
      </p>
      <p class="f3 color-fg-muted" sec:authorize="!isAuthenticated()">
        You may need to sign in to see this.
      </p>
    </th:block>
    <p class="f3 color-fg-muted" th:unless="${status == 404 or status == 403}">
      Something went wrong on the server.
    </p>

    <div class="blankslate-action d-flex flex-justify-center gap-2">
      <a th:href="@{/}" class="btn btn-primary">Go home</a>
      <a th:href="@{/login}" class="btn" sec:authorize="!isAuthenticated()">Sign in</a>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
