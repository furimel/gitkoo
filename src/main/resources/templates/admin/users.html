<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Users')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main class="container-xl px-3 px-md-4 px-lg-5 mt-4">
  <div class="Subhead">
    <h1 class="Subhead-heading">Users</h1>
    <p class="Subhead-description"><span th:text="${#lists.size(users)}">0</span> accounts on this instance.</p>
  </div>

  <div class="Box">
    <div class="Box-row d-flex flex-items-center gap-3" th:each="u : ${users}">
      <span class="avatar circle color-bg-emphasis color-fg-on-emphasis d-flex flex-items-center flex-justify-center text-bold flex-shrink-0"
            style="width:32px;height:32px"
            th:text="${#strings.toUpperCase(#strings.substring(u.username, 0, 1))}">U</span>
      <div class="flex-auto">
        <a class="text-bold" th:href="@{'/@/' + ${u.username}}"
           th:text="${u.displayName ?: u.username}">user</a>
        <div class="color-fg-muted f6" th:text="${u.email}">email</div>
      </div>
      <span th:if="${u.admin}" class="Label Label--accent">admin</span>
      <span class="Label"
            th:classappend="${u.status == 'ACTIVE'} ? ' Label--success' : ' Label--secondary'"
            th:text="${#strings.toLowerCase(u.status)}">active</span>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
