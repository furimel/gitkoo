<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Audit log')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('wide', ~{::content})}">
  <th:block th:fragment="content">

    <div th:replace="~{fragments/ui :: subhead('Audit log',
                       'Security-relevant actions recorded on this instance.', null)}"></div>

    <div th:replace="~{fragments/layout :: withSidebar('start', ~{::adminBody}, ~{::adminRail})}">
      <div th:fragment="adminRail" th:replace="~{fragments/layout :: adminNav('audit')}"></div>

      <th:block th:fragment="adminBody">

      <ul class="list" th:unless="${events.isEmpty()}">
        <li class="list-item" th:each="e : ${events}">
          <svg class="octicon color-fg-muted mt-1" width="16" height="16" aria-hidden="true">
            <use href="#octicon-shield"></use>
          </svg>
          <div class="flex-auto">
            <span class="text-bold" th:text="${e.action}">action</span>
            <span class="color-fg-muted" th:if="${e.targetType}"
                  th:text="${e.targetType + ' #' + e.targetId}">target</span>
            <div class="color-fg-muted f6 mt-1 d-flex flex-items-center gap-1">
              <span th:replace="~{fragments/ui :: timeAgo(${e.createdAt})}"></span>
              <span th:if="${e.ip}">&middot;</span>
              <span class="text-mono" th:if="${e.ip}" th:text="${e.ip}">ip</span>
            </div>
          </div>
        </li>
      </ul>

      <div th:if="${events.isEmpty()}"
           th:replace="~{fragments/ui :: emptyState('shield', 'No audit events',
                         'Events appear here when security-relevant actions occur.', null)}"></div>
      </th:block>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
