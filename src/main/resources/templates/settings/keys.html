<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('SSH keys')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('form', ~{::content})}">
  <th:block th:fragment="content">

    <div th:replace="~{fragments/ui :: subhead('SSH keys',
                       'Public keys that may push and pull over SSH.', null)}"></div>

    <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>
    <div th:if="${success}" class="flash flash-success" th:text="${success}"></div>

    <div class="section">
      <ul class="list" th:if="${keys != null and !keys.isEmpty()}">
        <li class="list-item" th:each="key : ${keys}">
          <svg class="octicon color-fg-muted mt-1 flex-shrink-0" width="16" height="16" aria-hidden="true">
            <use href="#octicon-key"></use>
          </svg>
          <div class="flex-auto">
            <strong th:text="${key.title ?: '(untitled)'}">title</strong>
            <div class="color-fg-muted f6 text-mono mt-1" th:text="${key.fingerprint}">fingerprint</div>
            <div class="color-fg-muted f6 mt-1">
              <span th:if="${key.keyType}" th:text="${key.keyType}">ed25519</span>
              <span th:if="${key.keyType}" class="mx-1">&middot;</span>
              Added <time th:datetime="${key.createdAt}" th:text="${key.createdAt}">date</time>
            </div>
          </div>
          <form th:action="@{'/settings/keys/' + ${key.id} + '/delete'}" method="post"
                data-confirm="Delete this SSH key? Anything using it will lose access.">
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
          </form>
        </li>
      </ul>

      <div th:if="${keys == null or keys.isEmpty()}"
           th:replace="~{fragments/ui :: emptyState('key', 'No SSH keys yet',
                         'Add a public key below to push and pull over SSH.', null)}"></div>
    </div>

    <div th:replace="~{fragments/form :: card('Add a new SSH key', @{/settings/keys},
                       ~{::newKey}, 'Add SSH key')}">
      <th:block th:fragment="newKey">
        <div th:replace="~{fragments/form :: field('title', 'title', 'Title', ${title},
                           'My laptop', null, 'field-w-md', false, false)}"></div>
        <div class="form-group mb-0">
          <label for="publicKey">Key</label>
          <textarea id="publicKey" name="publicKey" class="form-control width-full text-mono" rows="6"
                    placeholder="ssh-ed25519 AAAA..." autocomplete="off"
                    th:text="${publicKey}"></textarea>
          <p class="note">Paste the contents of your <code>~/.ssh/id_*.pub</code> file.</p>
        </div>
      </th:block>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
