<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Dashboard')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('wide', ~{::content})}">
  <th:block th:fragment="content">

    <div th:replace="~{fragments/ui :: subhead('Your repositories', null, ~{::newRepo})}">
      <a th:fragment="newRepo" th:href="@{/new}" class="btn btn-primary btn-sm">
        <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-repo"></use></svg>
        New
      </a>
    </div>

    <!--
      th:each must sit on a wrapper: th:replace has the higher precedence of the two,
      so on one element the fragment resolves before the loop variable exists.
    -->
    <ul class="list" th:if="${repos != null and !repos.isEmpty()}">
      <th:block th:each="r : ${repos}">
        <li th:replace="~{fragments/ui :: repoRow(${#authentication.name}, ${r})}"></li>
      </th:block>
    </ul>

    <div th:if="${repos == null or repos.isEmpty()}"
         th:replace="~{fragments/ui :: emptyState('repo', 'No repositories yet',
                       'Repositories you create will show up here.', ~{::createFirst})}">
      <a th:fragment="createFirst" th:href="@{/new}" class="btn btn-primary">Create a repository</a>
    </div>

    <div th:replace="~{fragments/common :: pagination(${page}, @{/})}"></div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
