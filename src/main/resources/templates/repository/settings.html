<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Settings - ' + ${owner} + '/' + ${repo.name})}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>
<div th:replace="~{fragments/layout :: repoHead(${owner}, ${repo}, 'settings')}"></div>

<main th:replace="~{fragments/layout :: page('form', ~{::content})}">
  <th:block th:fragment="content">

    <div th:if="${success}" class="flash flash-success" th:text="${success}"></div>

    <div th:replace="~{fragments/ui :: subhead('General', null, null)}"></div>

    <div th:replace="~{fragments/form :: card('Topics',
                       @{'/' + ${owner} + '/' + ${repo.name} + '/settings/topics'},
                       ~{::topicFields}, 'Save topics')}">
      <th:block th:fragment="topicFields">
        <div th:replace="~{fragments/form :: field('topics', 'topics', 'Topics',
                           ${#strings.listJoin(topics, ' ')}, 'java spring self-hosted',
                           'Separated by spaces or commas. Lowercased, at most 20.',
                           null, false, false)}"></div>
        <div class="d-flex flex-wrap gap-1" th:if="${topics != null and !topics.isEmpty()}">
          <span th:each="topic : ${topics}" class="topic-tag" th:text="${topic}">topic</span>
        </div>
      </th:block>
    </div>

    <div th:replace="~{fragments/form :: card(null,
                       @{'/' + ${owner} + '/' + ${repo.name} + '/settings'},
                       ~{::fields}, 'Save changes')}">
      <th:block th:fragment="fields">
        <div class="form-group">
          <label for="name">Repository name</label>
          <input type="text" id="name" name="name" class="form-control width-full field-w-md"
                 th:value="${repo.name}" disabled>
          <p class="note">The repository name cannot be changed.</p>
        </div>

        <div th:replace="~{fragments/form :: field('description', 'description',
                           'Description (optional)', ${repo.description},
                           'A short description', null, null, false, false)}"></div>

        <div th:replace="~{fragments/form :: field('defaultBranch', 'defaultBranch',
                           'Default branch', ${repo.defaultBranch}, null,
                           'The branch shown when someone opens this repository.',
                           'field-w-sm', false, false)}"></div>

        <h3 class="f5">Visibility</h3>
        <div th:replace="~{fragments/form :: radioOption('vis-public', 'visibility', 'PUBLIC',
                           ${repo.visibility == 'PUBLIC'}, 'repo', 'Public',
                           'Anyone on this server can see this repository.')}"></div>
        <div th:replace="~{fragments/form :: radioOption('vis-private', 'visibility', 'PRIVATE',
                           ${repo.visibility == 'PRIVATE'}, 'lock', 'Private',
                           'You choose who can see and commit to this repository.')}"></div>
      </th:block>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
