<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Activity - ' + ${owner} + '/' + ${repo.name})}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>
<div th:replace="~{fragments/layout :: repoHead(${owner}, ${repo}, 'activity')}"></div>

<main th:replace="~{fragments/layout :: page('wide', ~{::content})}">
  <th:block th:fragment="content">

    <div th:replace="~{fragments/ui :: subhead('Activity', null, null)}"></div>

    <ul class="list" th:unless="${activities.isEmpty()}">
      <li class="list-item flex-items-center" th:each="a : ${activities}">
        <svg class="octicon color-fg-muted" width="16" height="16" aria-hidden="true">
          <use href="#octicon-git-commit"></use>
        </svg>
        <span class="flex-auto" th:text="${a.message}">message</span>
        <span class="color-fg-muted f6 no-wrap" th:replace="~{fragments/ui :: timeAgo(${a.createdAt})}"></span>
      </li>
    </ul>

    <div th:if="${activities.isEmpty()}"
         th:replace="~{fragments/ui :: emptyState('history', 'No activity yet',
                       'Activity appears when someone pushes, opens issues, or merges pull requests.', null)}"></div>

    <div th:replace="~{fragments/common :: pagination(${page}, @{'/' + ${owner} + '/' + ${repo.name} + '/activity'})}"></div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
