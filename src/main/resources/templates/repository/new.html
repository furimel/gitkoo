<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('New repository')}"></head>
<body>
  <header th:replace="~{fragments/common :: header}"></header>
  <div class="container-app max-w-lg">
    <h1 class="mb-4">Create a new repository</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/new}" method="post">
      <div class="field">
        <label for="name">Repository name</label>
        <input type="text" id="name" name="name" class="input" th:value="${name}" required
               placeholder="name" autocomplete="off">
        <div class="hint">Great repository names are short and memorable.</div>
      </div>

      <div class="field">
        <label for="description">Description <span class="text-subtle">(optional)</span></label>
        <input type="text" id="description" name="description" class="input" th:value="${description}"
               placeholder="A short description">
      </div>

      <fieldset class="field" style="border:0;padding:0">
        <legend class="font-semibold text-sm mb-2">Visibility</legend>
        <label class="flex items-center gap-2 mb-2 cursor-pointer">
          <input type="radio" name="visibility" value="PUBLIC" checked>
          <span><strong>Public</strong> \u2014 anyone can see this repository</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="visibility" value="PRIVATE">
          <span><strong>Private</strong> \u2014 only you and collaborators can see it</span>
        </label>
      </fieldset>

      <div class="field">
        <label for="defaultBranch">Default branch</label>
        <input type="text" id="defaultBranch" name="defaultBranch" class="input" value="main">
      </div>

      <button type="submit" class="btn btn-primary">Create repository</button>
    </form>
  </div>
</body>
</html>
