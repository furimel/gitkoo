<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('New repository')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('form', ~{::content})}">
  <th:block th:fragment="content">

    <div th:replace="~{fragments/ui :: subhead('Create a new repository',
                       'A repository contains all project files, including the revision history.',
                       null)}"></div>

    <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>

    <div th:replace="~{fragments/form :: card(null, @{/new}, ~{::fields}, 'Create repository')}">
      <th:block th:fragment="fields">
        <div th:replace="~{fragments/form :: field('name', 'name', 'Repository name', ${name},
                           'my-project', 'Great repository names are short and memorable.',
                           'field-w-md', true, true)}"></div>
        <div th:replace="~{fragments/form :: field('description', 'description',
                           'Description (optional)', ${description},
                           'A short description of this repository', null, null, false, false)}"></div>

        <hr>

        <div th:replace="~{fragments/form :: radioOption('vis-public', 'visibility', 'PUBLIC',
                           true, 'repo', 'Public',
                           'Anyone on this server can see this repository.')}"></div>
        <div th:replace="~{fragments/form :: radioOption('vis-private', 'visibility', 'PRIVATE',
                           false, 'lock', 'Private',
                           'You choose who can see and commit to this repository.')}"></div>

        <hr>

        <div th:replace="~{fragments/form :: field('defaultBranch', 'defaultBranch',
                           'Default branch', 'main', null, null, 'field-w-sm', false, false)}"></div>
      </th:block>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
