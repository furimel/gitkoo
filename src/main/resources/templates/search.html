<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Search')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('wide', ~{::content})}">
  <th:block th:fragment="content">

    <div th:replace="~{fragments/ui :: subhead('Search results',
                       ${query != null} ? ${#lists.size(results)} + ' repositories matching ' + ${query} : null,
                       null)}"></div>

    <form th:action="@{/search}" method="get" class="Box">
      <div class="Box-body d-flex gap-2">
        <input type="text" name="q" class="form-control flex-auto" th:value="${query}"
               placeholder="Search repositories..." required aria-label="Search query">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <ul class="list" th:if="${results != null and !results.isEmpty()}">
      <li class="list-item" th:each="r : ${results}">
        <svg class="octicon color-fg-muted mt-1" width="16" height="16" aria-hidden="true">
          <use th:href="${r.visibility == 'PRIVATE'} ? '#octicon-lock' : '#octicon-repo'"></use>
        </svg>
        <div class="flex-auto">
          <a class="f4 text-bold" th:if="${r.owner != null}"
             th:href="@{'/' + ${r.owner} + '/' + ${r.name}}">
            <span th:text="${r.owner}">owner</span><span class="color-fg-muted">/</span><span th:text="${r.name}">name</span>
          </a>
          <span class="f4 text-bold" th:if="${r.owner == null}" th:text="${r.name}">name</span>
          <span th:replace="~{fragments/ui :: visibilityLabel(${r.visibility})}"></span>
          <p class="color-fg-muted mb-0 mt-1" th:if="${r.description}" th:text="${r.description}">description</p>
        </div>
      </li>
    </ul>

    <div th:if="${results != null and results.isEmpty() and query != null}"
         th:replace="~{fragments/ui :: emptyState('search', 'No results',
                       'No repositories match that search.', null)}"></div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
