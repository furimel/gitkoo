<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Search')}"></head>
<body>
  <header th:replace="~{fragments/common :: header}"></header>
  <div class="container-app">
    <h1 class="mb-4">Search</h1>
    <form th:action="@{/search}" method="get" class="mb-4">
      <div class="flex gap-2">
        <input type="text" name="q" class="input" th:value="${query}" placeholder="Search repositories..." required>
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>
    <div th:if="${results != null and !results.isEmpty()}" class="card p-0">
      <div class="commit-item" th:each="r : ${results}">
        <span class="title font-medium" th:text="${r.name}">name</span>
        <span class="text-muted text-sm" th:if="${r.description}" th:text="${r.description}">desc</span>
      </div>
    </div>
    <div th:if="${results != null and results.isEmpty() and query != null}" class="empty-state">
      <h2>No results</h2>
      <p>No repositories found for "<span th:text="${query}">q</span>".</p>
    </div>
  </div>
</body>
</html>
