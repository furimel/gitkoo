<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Form pieces.

  There used to be two conventions for the same thing: some forms sat in a Box and
  some floated bare on the canvas. The bare ones then needed an inline max-width to
  stop the fields spanning the whole container, which is where six of the twenty
  hardcoded pixel widths came from. One convention now: a form is a card.
-->
<body>

<!-- A labelled text input. `width` is one of the field-w-* steps, or null for full. -->
<div th:fragment="field(id, name, label, value, placeholder, note, width, required, autofocus)"
     class="form-group">
  <label th:for="${id}" th:text="${label}">Label</label>
  <input type="text" class="form-control width-full"
         th:id="${id}" th:name="${name}" th:value="${value}"
         th:classappend="${width}" th:placeholder="${placeholder}"
         th:required="${required}" th:autofocus="${autofocus}" autocomplete="off">
  <p class="note" th:if="${note != null}" th:text="${note}">Note</p>
</div>

<div th:fragment="password(id, name, label, note)" class="form-group">
  <label th:for="${id}" th:text="${label}">Password</label>
  <input type="password" class="form-control width-full" th:id="${id}" th:name="${name}"
         required minlength="8" autocomplete="new-password">
  <p class="note" th:if="${note != null}" th:text="${note}">Note</p>
</div>

<div th:fragment="textarea(id, name, label, value, rows, placeholder)" class="form-group">
  <label th:for="${id}" th:text="${label}" th:if="${label != null}">Label</label>
  <textarea class="form-control width-full" th:id="${id}" th:name="${name}" th:rows="${rows}"
            th:placeholder="${placeholder}" th:text="${value}"></textarea>
</div>

<!-- The Public/Private pair, previously duplicated verbatim in two templates. -->
<div th:fragment="radioOption(id, name, value, checked, icon, label, note)" class="form-checkbox">
  <label th:for="${id}">
    <input type="radio" th:id="${id}" th:name="${name}" th:value="${value}" th:checked="${checked}">
    <span class="d-inline-flex flex-items-center gap-2">
      <svg class="octicon color-fg-muted" width="16" height="16" aria-hidden="true">
        <use th:href="'#octicon-' + ${icon}"></use>
      </svg>
      <span th:text="${label}">Label</span>
    </span>
  </label>
  <p class="note" th:text="${note}">Note</p>
</div>

<!-- A form as a card: header, body, and a footer holding the submit. -->
<div th:fragment="card(title, action, fields, submitLabel)" class="Box">
  <div class="Box-header" th:if="${title != null}">
    <h2 class="Box-title" th:text="${title}">Title</h2>
  </div>
  <form th:action="${action}" method="post">
    <div class="Box-body"><th:block th:replace="${fields}"></th:block></div>
    <div class="Box-footer d-flex flex-justify-end">
      <button type="submit" class="btn btn-primary" th:text="${submitLabel}">Save</button>
    </div>
  </form>
</div>

<!-- Sign in, register and first-run setup all wear this. -->
<div th:fragment="authCard(heading, sub, action, fields, submitLabel, altPrompt, altHref, altLabel)">
  <div class="text-center">
    <svg class="octicon" width="48" height="48" aria-hidden="true"><use href="#gitkoo-logo"></use></svg>
    <h1 class="f2 text-normal" th:text="${heading}">Heading</h1>
    <p class="color-fg-muted" th:if="${sub != null}" th:text="${sub}">Subtitle</p>
  </div>

  <div class="Box Box--spacious">
    <form th:action="${action}" method="post">
      <div class="Box-body">
        <th:block th:replace="${fields}"></th:block>
        <button type="submit" class="btn btn-primary btn-block" th:text="${submitLabel}">Continue</button>
      </div>
    </form>
  </div>

  <div class="Box text-center" th:if="${altPrompt != null}">
    <div class="Box-body">
      <span th:text="${altPrompt}">Prompt</span>
      <a th:href="${altHref}" th:text="${altLabel}">Link</a>
    </div>
  </div>
</div>

</body>
</html>
