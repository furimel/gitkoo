<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Page shells.

  A template never names its own container. It hands its body to `page` and the
  shell decides the width and the top gap, so the 24 hand-written copies of
  `container-xl px-3 px-md-4 px-lg-5 mt-4` cannot come back and drift apart.

  Usage:

    <main th:replace="~{fragments/layout :: page('wide', ~{::content})}">
      <th:block th:fragment="content"> ... </th:block>
    </main>

  Widths: wide (1280, app pages) | form (768, settings) | narrow (768, short forms)
          | auth (544, sign-in and friends).
-->
<body>

<main th:fragment="page(width, content)" th:class="'page page--' + ${width}">
  <th:block th:replace="${content}"></th:block>
</main>

<!--
  Two-column page. Primer's bare .Layout is already 296px at desktop, which is
  GitHub's sidebar width; the --sidebar-wide modifier is 336px and made every
  sidebar here 40px too fat, so it is deliberately absent.
-->
<div th:fragment="withSidebar(position, main, aside)"
     class="Layout" th:classappend="${position == 'start'} ? 'Layout--sidebarPosition-start'
                                                            : 'Layout--sidebarPosition-end'">
  <div class="Layout-main"><th:block th:replace="${main}"></th:block></div>
  <div class="Layout-sidebar"><th:block th:replace="${aside}"></th:block></div>
</div>

<!--
  Site administration nav. Three loose buttons on one page and nothing at all on the
  other three is not navigation; this is the same rail on all four.
-->
<nav th:fragment="adminNav(active)" class="SideNav border rounded-2" aria-label="Administration">
  <a class="SideNav-item" th:classappend="${active == 'overview'} ? ' selected'"
     th:aria-current="${active == 'overview'} ? 'page' : null" th:href="@{/admin}">
    <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-shield"></use></svg>
    Overview
  </a>
  <a class="SideNav-item" th:classappend="${active == 'users'} ? ' selected'"
     th:aria-current="${active == 'users'} ? 'page' : null" th:href="@{/admin/users}">
    <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-people"></use></svg>
    Users
  </a>
  <a class="SideNav-item" th:classappend="${active == 'system'} ? ' selected'"
     th:aria-current="${active == 'system'} ? 'page' : null" th:href="@{/admin/system}">
    <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-gear"></use></svg>
    System
  </a>
  <a class="SideNav-item" th:classappend="${active == 'audit'} ? ' selected'"
     th:aria-current="${active == 'audit'} ? 'page' : null" th:href="@{/admin/audit}">
    <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-history"></use></svg>
    Audit log
  </a>
</nav>

<!-- ══ Repository title band + tab bar ═════════════════════════════════ -->
<div th:fragment="repoHead(owner, repo, tab)" class="repo-head">
  <div class="page page--wide page--flush">
    <div class="repo-title">
      <svg class="octicon color-fg-muted" width="16" height="16" aria-hidden="true">
        <use th:href="${repo.visibility == 'PRIVATE'} ? '#octicon-lock' : '#octicon-repo'"></use>
      </svg>
      <a class="Link--primary" th:href="@{'/@/' + ${owner}}" th:text="${owner}">owner</a>
      <span class="separator">/</span>
      <strong><a th:href="@{'/' + ${owner} + '/' + ${repo.name}}" th:text="${repo.name}">repo</a></strong>
      <span class="Label Label--secondary" th:text="${#strings.toLowerCase(repo.visibility)}">public</span>
      <span class="color-fg-muted f6" th:if="${forkedFrom != null}">
        forked from
        <a th:href="@{'/' + ${forkedFrom}}" th:text="${forkedFrom}">owner/repo</a>
      </span>
      <div class="ml-auto">
        <div th:replace="~{fragments/repo :: repoActions(${owner}, ${repo}, ${starCount},
                           ${watcherCount}, ${starred}, ${watching})}"></div>
      </div>
    </div>

    <nav class="UnderlineNav" aria-label="Repository">
      <ul class="UnderlineNav-body list-style-none">
        <li class="d-inline-flex">
          <a class="UnderlineNav-item" th:classappend="${tab == 'code'} ? ' selected'"
             th:href="@{'/' + ${owner} + '/' + ${repo.name}}"
             th:aria-current="${tab == 'code'} ? 'page' : null">
            <svg class="octicon UnderlineNav-octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-code"></use></svg>
            <span>Code</span>
          </a>
        </li>
        <li class="d-inline-flex">
          <a class="UnderlineNav-item" th:classappend="${tab == 'issues'} ? ' selected'"
             th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/issues'}"
             th:aria-current="${tab == 'issues'} ? 'page' : null">
            <svg class="octicon UnderlineNav-octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-issue-opened"></use></svg>
            <span>Issues</span>
            <span class="Counter" th:if="${openIssueCount != null and openIssueCount > 0}"
                  th:text="${openIssueCount}">0</span>
          </a>
        </li>
        <li class="d-inline-flex">
          <a class="UnderlineNav-item" th:classappend="${tab == 'pulls'} ? ' selected'"
             th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/pulls'}"
             th:aria-current="${tab == 'pulls'} ? 'page' : null">
            <svg class="octicon UnderlineNav-octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-git-pull-request"></use></svg>
            <span>Pull requests</span>
            <span class="Counter" th:if="${openPrCount != null and openPrCount > 0}"
                  th:text="${openPrCount}">0</span>
          </a>
        </li>
        <li class="d-inline-flex">
          <a class="UnderlineNav-item" th:classappend="${tab == 'actions'} ? ' selected'"
             th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/actions'}"
             th:aria-current="${tab == 'actions'} ? 'page' : null">
            <svg class="octicon UnderlineNav-octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-play"></use></svg>
            <span>Actions</span>
          </a>
        </li>
        <li class="d-inline-flex">
          <a class="UnderlineNav-item" th:classappend="${tab == 'activity'} ? ' selected'"
             th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/activity'}"
             th:aria-current="${tab == 'activity'} ? 'page' : null">
            <svg class="octicon UnderlineNav-octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-history"></use></svg>
            <span>Activity</span>
          </a>
        </li>
        <!-- Hidden from anonymous visitors, for whom it only leads to the login page. -->
        <li class="d-inline-flex" sec:authorize="isAuthenticated()">
          <a class="UnderlineNav-item" th:classappend="${tab == 'settings'} ? ' selected'"
             th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/settings'}"
             th:aria-current="${tab == 'settings'} ? 'page' : null">
            <svg class="octicon UnderlineNav-octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-gear"></use></svg>
            <span>Settings</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>

</body>
</html>
