<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Unified diff rendering.

  This markup used to exist in three verbatim copies - repository/diff.html,
  repository/commit.html and pr/view.html - so a fix to one silently left the other
  two behind. There is one copy now.
-->
<body>

<!-- "Showing N changed files  +A -D" -->
<h2 th:fragment="summary(count, additions, deletions, verb)"
    class="f4 d-flex flex-items-center flex-wrap gap-2">
  <svg class="octicon color-fg-muted" width="16" height="16" aria-hidden="true"><use href="#octicon-file"></use></svg>
  <span th:text="${verb}">Showing</span>
  <span class="Counter" th:text="${count}">0</span>
  <span th:text="${count == 1} ? 'changed file' : 'changed files'">changed files</span>
  <span class="f6 text-normal">
    <span class="color-fg-success text-bold">+<span th:text="${additions}">0</span></span>
    <span class="color-fg-danger text-bold">&minus;<span th:text="${deletions}">0</span></span>
  </span>
</h2>

<!-- Every changed file, or the empty state when the refs are identical. -->
<div th:fragment="files(diffFiles)">
  <div th:if="${diffFiles.isEmpty()}"
       th:replace="~{fragments/ui :: emptyState('file', 'No changes', 'These refs are identical.', null)}"></div>

  <div class="diff-file" th:each="file : ${diffFiles}">
    <div class="diff-file-header">
      <svg class="octicon color-fg-muted" width="16" height="16" aria-hidden="true"><use href="#octicon-file"></use></svg>
      <strong th:text="${file.path}">path</strong>
      <span class="ml-auto">
        <span class="color-fg-success text-bold">+<span th:text="${file.additions}">0</span></span>
        <span class="color-fg-danger text-bold">&minus;<span th:text="${file.deletions}">0</span></span>
      </span>
    </div>

    <p th:if="${file.binary}" class="border border-top-0 rounded-bottom-2 p-3 color-fg-muted mb-0">
      Binary file not shown.
    </p>

    <!-- data-language lets gitkoo.js highlight both sides with the right grammar. -->
    <table class="diff-table" th:unless="${file.binary}" th:attr="data-language=${file.language}">
      <tbody>
        <tr th:each="line : ${file.lines}"
            th:classappend="${line.isHunk()} ? ' diff-line--hunk'
                            : (${line.isAddition()} ? ' diff-line--add'
                            : (${line.isDeletion()} ? ' diff-line--del' : ''))">
          <th:block th:if="${line.isHunk()}">
            <td colspan="3" th:text="${line.content}">@@</td>
          </th:block>
          <th:block th:unless="${line.isHunk()}">
            <td class="diff-num" th:text="${line.oldNumber}"></td>
            <td class="diff-num" th:text="${line.newNumber}"></td>
            <td class="diff-code" th:text="${line.content}">code</td>
          </th:block>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
