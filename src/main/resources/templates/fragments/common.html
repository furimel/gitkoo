<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' — GitKoo'">GitKoo</title>
  <link rel="stylesheet" th:href="@{/css/gitkoo.css}">
</head>
<body>
  <nav class="navbar" th:fragment="navbar">
    <a th:href="@{/}" class="brand">GitKoo</a>
    <div class="nav-links" sec:authorize="isAuthenticated()">
      <a th:href="@{/}">Dashboard</a>
      <form th:action="@{/logout}" method="post" style="display:inline">
        <button type="submit" class="btn" style="padding:0.25rem 0.5rem;font-size:0.85rem">Sign out</button>
      </form>
    </div>
  </nav>
</body>
</html>
