<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' \u00b7 GitKoo'">GitKoo</title>
  <link rel="stylesheet" th:href="@{/assets/css/gitkoo.css}">
  <script th:src="@{/assets/js/gitkoo.js}" defer></script>
</head>
<body>
  <header class="app-header" th:fragment="header">
    <a th:href="@{/}" class="brand">GitKoo</a>
    <div class="nav-spacer"></div>
    <button class="theme-toggle" type="button" aria-label="Toggle theme"></button>
    <nav class="flex items-center gap-3" sec:authorize="isAuthenticated()">
      <a th:href="@{/new}" class="btn btn-sm">New repository</a>
      <form th:action="@{/logout}" method="post" class="inline-flex">
        <button type="submit" class="btn btn-sm">Sign out</button>
      </form>
    </nav>
  </header>
</body>
</html>
