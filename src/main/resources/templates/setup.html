<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Setup')}"></head>
<body>
  <nav th:replace="~{fragments/common :: navbar}"></nav>
  <div class="container">
    <div class="auth-card">
      <h1>Welcome to GitKoo</h1>
      <p style="color:var(--text-muted);margin-bottom:1.5rem">
        Create your administrator account to get started.
      </p>

      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <form th:action="@{/setup}" method="post">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 th:value="${username}" required
                 placeholder="e.g. minh"
                 autocomplete="username">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email"
                 th:value="${email}" required
                 autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required
                 minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required
                 minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create administrator account</button>
      </form>
    </div>
  </div>
</body>
</html>
