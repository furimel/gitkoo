<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Setup')}"></head>
<body>
  <header th:replace="~{fragments/common :: header}"></header>
  <div class="container-app">
    <div class="auth-card">
      <h1>Welcome to GitKoo</h1>
      <p class="text-muted text-sm mt-2 mb-4">Create your administrator account to get started.</p>

      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <form th:action="@{/setup}" method="post">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="input"
                 th:value="${username}" required
                 placeholder="e.g. minh" autocomplete="username">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="input"
                 th:value="${email}" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="input"
                 required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="input"
                 required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-full">Create administrator account</button>
      </form>
    </div>
  </div>
</body>
</html>
