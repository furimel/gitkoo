<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(${profile.displayName ?: profile.username})}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('wide', ~{::content})}">
  <th:block th:fragment="content">
    <div th:replace="~{fragments/layout :: withSidebar('start', ~{::repos}, ~{::identity})}">

      <!-- ══ Identity ══════════════════════════════════════════════════ -->
      <th:block th:fragment="identity">
        <span th:replace="~{fragments/common :: avatarProfile(${profile.username})}"></span>

        <div class="section">
          <h1 class="f2 text-normal lh-condensed" th:text="${profile.displayName ?: profile.username}">Name</h1>
          <p class="f3 color-fg-muted" th:text="${profile.username}">username</p>
          <p th:if="${profile.bio}" th:text="${profile.bio}">bio</p>
          <a th:if="${isSelf}" th:href="@{/settings/keys}" class="btn btn-block">Edit profile</a>
        </div>

        <ul class="d-flex flex-column gap-2 color-fg-muted f6 list-style-none">
          <li class="d-flex flex-items-center gap-2">
            <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-repo"></use></svg>
            <span><strong class="color-fg-default" th:text="${repoCount}">0</strong> repositories</span>
          </li>
          <li class="d-flex flex-items-center gap-2" th:if="${profile.createdAt != null}">
            <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-clock"></use></svg>
            <span>Joined <time th:datetime="${profile.createdAt}" th:text="${profile.createdAt}">date</time></span>
          </li>
          <li class="d-flex flex-items-center gap-2" th:if="${profile.admin}">
            <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-shield"></use></svg>
            <span>Site administrator</span>
          </li>
        </ul>
      </th:block>

      <!-- ══ Repositories ══════════════════════════════════════════════ -->
      <th:block th:fragment="repos">
        <div class="Subhead">
          <h2 class="Subhead-heading f4">Repositories</h2>
          <div class="Subhead-actions"><span class="Counter" th:text="${repoCount}">0</span></div>
        </div>

        <ul class="list" th:unless="${repos.isEmpty()}">
          <th:block th:each="r : ${repos}">
            <li th:replace="~{fragments/ui :: repoRow(${profile.username}, ${r})}"></li>
          </th:block>
        </ul>

        <div th:if="${repos.isEmpty() and isSelf}"
             th:replace="~{fragments/ui :: emptyState('repo', 'No repositories to show',
                           'Repositories you create will appear here.', ~{::createFirst})}">
          <a th:fragment="createFirst" th:href="@{/new}" class="btn btn-primary">New repository</a>
        </div>
        <div th:if="${repos.isEmpty() and !isSelf}"
             th:replace="~{fragments/ui :: emptyState('repo', 'No repositories to show',
                           'This user has no repositories you can see.', null)}"></div>

        <div th:replace="~{fragments/common :: pagination(${page}, @{'/@/' + ${profile.username}})}"></div>
      </th:block>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
