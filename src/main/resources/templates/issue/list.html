<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Issues - ' + ${owner} + '/' + ${repo.name})}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>
<div th:replace="~{fragments/common :: repoHead(${owner}, ${repo}, 'issues')}"></div>

<main class="container-xl px-3 px-md-4 px-lg-5 mt-4">

  <div class="d-flex flex-justify-end mb-3" sec:authorize="isAuthenticated()">
    <a th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/new'}" class="btn btn-primary">New issue</a>
  </div>

  <div class="Box">
    <!-- Open / Closed filter bar, GitHub's issue list header -->
    <div class="Box-header d-flex flex-items-center gap-3">
      <a class="d-flex flex-items-center gap-1"
         th:classappend="${filter == 'open'} ? ' text-bold color-fg-default' : ' Link--secondary'"
         th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/issues'}">
        <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-issue-opened"></use></svg>
        <span th:text="${openCount}">0</span> Open
      </a>
      <a class="d-flex flex-items-center gap-1"
         th:classappend="${filter == 'closed'} ? ' text-bold color-fg-default' : ' Link--secondary'"
         th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/issues' (state='closed')}">
        <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-issue-closed"></use></svg>
        <span th:text="${closedCount}">0</span> Closed
      </a>
    </div>

    <div class="Box-row d-flex flex-items-start" th:each="i : ${issues}">
      <svg class="octicon mt-1 mr-2 flex-shrink-0" width="16" height="16" aria-hidden="true"
           th:classappend="${i.status == 'OPEN'} ? ' color-fg-success' : ' color-fg-done'">
        <use th:href="${i.status == 'OPEN'} ? '#octicon-issue-opened' : '#octicon-issue-closed'"></use>
      </svg>
      <div class="flex-auto">
        <a class="f4 text-bold Link--primary"
           th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/' + ${i.number}}"
           th:text="${i.title}">title</a>
        <!-- Batch-loaded in the controller, so this costs no query per row. -->
        <span th:each="label : ${issueLabels.get(i.id)}" class="Label ml-1"
              th:style="'background:' + ${label.color} + ';color:#fff'"
              th:title="${label.description}" th:text="${label.name}">label</span>
        <div class="color-fg-muted f6 mt-1">
          #<span th:text="${i.number}">1</span>
          <span th:if="${i.status == 'OPEN'}">opened</span>
          <span th:unless="${i.status == 'OPEN'}">closed</span>
          <time th:if="${i.createdAt != null}" th:datetime="${i.createdAt}" th:text="${i.createdAt}">date</time>
        </div>
      </div>
    </div>

    <div th:if="${issues.isEmpty()}" class="blankslate">
      <svg class="octicon blankslate-icon" width="24" height="24" aria-hidden="true"><use href="#octicon-issue-opened"></use></svg>
      <!-- An empty "closed" tab means none are closed yet, not that none exist. -->
      <th:block th:if="${filter == 'closed'}">
        <h3 class="blankslate-heading">No closed issues</h3>
        <p>Issues you close will be listed here.</p>
      </th:block>
      <th:block th:unless="${filter == 'closed'}">
        <h3 class="blankslate-heading">No open issues</h3>
        <p>Issues are a good way to track bugs and tasks.</p>
        <a sec:authorize="isAuthenticated()" th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/new'}" class="btn btn-primary">New issue</a>
      </th:block>
    </div>
  </div>

  <div th:replace="~{fragments/common :: pagination(${page}, @{'/' + ${owner} + '/' + ${repo.name} + '/issues'} + (${filter == 'closed'} ? '?state=closed' : ''))}"></div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
