<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Issues')}"></head>
<body>
  <header th:replace="~{fragments/common :: header}"></header>
  <div class="container-app">
    <div class="repo-header">
      <div class="repo-title">
        <a th:href="'/@/' + ${owner}" class="owner" th:text="${owner}"></a>
        <span class="sep">/</span>
        <strong th:text="${repo.name}"></strong>
      </div>
    </div>
    <nav class="repo-tabs">
      <a th:href="@{'/' + ${owner} + '/' + ${repo.name}}">Code</a>
      <a th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/issues'}" class="active">Issues</a>
      <a th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/pulls'}">Pull Requests</a>
      <a th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/actions'}">Actions</a>
    </nav>
    <div class="flex items-center justify-between mb-3">
      <h2>Issues</h2>
      <a th:href="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/new'}" class="btn btn-primary">New issue</a>
    </div>
    <div th:if="${issues.isEmpty()}" class="empty-state">
      <h2>No issues yet</h2>
      <p>Issues are a great way to track bugs and tasks.</p>
    </div>
    <div th:unless="${issues.isEmpty()}" class="card p-0">
      <div class="commit-item" th:each="i : ${issues}">
        <span class="sha">#<span th:text="${i.number}">N</span></span>
        <span class="title font-medium" th:text="${i.title}">title</span>
        <span class="text-sm px-2 rounded-full" th:if="${i.status == 'OPEN'}"
              style="background:var(--success-subtle);color:var(--success-fg)">Open</span>
        <span class="text-sm px-2 rounded-full" th:if="${i.status == 'CLOSED'}"
              style="background:var(--canvas-subtle);color:var(--fg-muted)">Closed</span>
      </div>
    </div>
  </div>
</body>
</html>
