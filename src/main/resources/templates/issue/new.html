<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('New issue')}"></head>
<body>
  <header th:replace="~{fragments/common :: header}"></header>
  <div class="container-app max-w-lg">
    <div class="repo-header">
      <div class="repo-title">
        <a th:href="'/@/' + ${owner}" class="owner" th:text="${owner}"></a>
        <span class="sep">/</span>
        <strong th:text="${repo.name}"></strong>
      </div>
    </div>
    <h1 class="mb-4">New issue</h1>
    <form th:action="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/new'}" method="post">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" class="input" required placeholder="Brief description">
      </div>
      <div class="field">
        <label for="body">Comment</label>
        <textarea id="body" name="body" class="input" rows="10" placeholder="Describe the issue (Markdown supported)"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Create issue</button>
    </form>
  </div>
</body>
</html>
