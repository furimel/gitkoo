<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(${issue.title} + ' - Issue #' + ${issue.number})}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>
<div th:replace="~{fragments/layout :: repoHead(${owner}, ${repo}, 'issues')}"></div>

<main th:replace="~{fragments/layout :: page('wide', ~{::content})}">
  <th:block th:fragment="content">

    <div th:replace="~{fragments/conversation :: header(${issue.title}, ${issue.number},
                       'issue', ${issue.status}, ~{::byline})}">
      <th:block th:fragment="byline">
        <strong th:text="${author?.displayName ?: author?.username ?: 'Unknown'}">author</strong>
        opened this issue
        <span th:replace="~{fragments/ui :: timeAgo(${issue.createdAt})}"></span>
        <span class="mx-1">&middot;</span>
        <span th:text="${#lists.size(comments)}">0</span>
        <span th:text="${#lists.size(comments) == 1} ? 'comment' : 'comments'">comments</span>
      </th:block>
    </div>

    <div th:replace="~{fragments/layout :: withSidebar('end', ~{::timeline}, ~{::metaRail})}">

      <!-- ══ Conversation ══════════════════════════════════════════════ -->
      <th:block th:fragment="timeline">
        <div th:replace="~{fragments/conversation :: comment(${author?.username},
                           ${author?.displayName}, 'commented', ${issue.createdAt},
                           ${issueBodyHtml})}"></div>

        <th:block th:each="c,iter : ${comments}">
          <div th:replace="~{fragments/conversation :: comment(
                             ${commentAuthors[iter.index]?.username},
                             ${commentAuthors[iter.index]?.displayName},
                             'commented', ${c.createdAt}, ${markdown.render(c.body)})}"></div>
        </th:block>

        <div th:if="${issue.status == 'CLOSED'}"
             th:replace="~{fragments/conversation :: event('issue-closed',
                           'color-bg-done-emphasis color-fg-on-emphasis', ~{::closedNote})}">
          <th:block th:fragment="closedNote">
            This issue was closed
            <span th:replace="~{fragments/ui :: timeAgo(${issue.closedAt})}"></span>
          </th:block>
        </div>

        <!-- The comment box is the last item on the rail, as on GitHub. -->
        <div class="TimelineItem" sec:authorize="isAuthenticated()">
          <div class="TimelineItem-avatar">
            <span th:replace="~{fragments/common :: avatar(${#authentication.name}, 40)}"></span>
          </div>
          <div class="TimelineItem-body">
            <form th:if="${issue.status == 'OPEN'}" method="post" class="Box"
                  th:action="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/' + ${issue.number} + '/comment'}">
              <div class="Box-header">
                <label class="text-bold" for="body">Add a comment</label>
              </div>
              <div class="Box-body">
                <textarea id="body" name="body" class="form-control width-full" rows="5"
                          placeholder="Leave a comment (Markdown supported)"></textarea>
              </div>
              <div class="Box-footer d-flex flex-justify-end gap-2">
                <!-- Close posts to its own route, so it sits outside this form. -->
                <button type="submit" form="close-issue-form" class="btn">
                  <svg class="octicon color-fg-done" width="16" height="16" aria-hidden="true"><use href="#octicon-issue-closed"></use></svg>
                  Close issue
                </button>
                <button type="submit" class="btn btn-primary">Comment</button>
              </div>
            </form>

            <form th:if="${issue.status == 'OPEN'}" id="close-issue-form" method="post" hidden
                  th:action="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/' + ${issue.number} + '/close'}"></form>

            <form th:if="${issue.status == 'CLOSED'}" method="post"
                  th:action="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/' + ${issue.number} + '/reopen'}">
              <button type="submit" class="btn">
                <svg class="octicon color-fg-success" width="16" height="16" aria-hidden="true"><use href="#octicon-issue-opened"></use></svg>
                Reopen issue
              </button>
            </form>
          </div>
        </div>
      </th:block>

      <!-- ══ Metadata rail ═════════════════════════════════════════════ -->
      <th:block th:fragment="metaRail">
        <div th:replace="~{fragments/conversation :: sidebarSection('Labels',
                           ~{::labelMenu}, ~{::labelList})}"></div>

        <div class="section color-fg-muted f6">
          <div class="d-flex flex-items-center gap-2 mb-1">
            <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-person"></use></svg>
            <span>Opened by <strong th:text="${author?.username ?: 'unknown'}">author</strong></span>
          </div>
          <div class="d-flex flex-items-center gap-2">
            <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-comment"></use></svg>
            <span><span th:text="${#lists.size(comments)}">0</span> comments</span>
          </div>
        </div>
      </th:block>

      <details th:fragment="labelMenu" class="details-overlay details-reset position-relative">
        <summary class="btn-octicon" role="button" aria-label="Manage labels">
          <svg class="octicon" width="16" height="16" aria-hidden="true"><use href="#octicon-gear"></use></svg>
        </summary>
        <div class="SelectMenu right-0">
          <div class="SelectMenu-modal">
            <header class="SelectMenu-header">
              <h3 class="SelectMenu-title">Apply labels to this issue</h3>
            </header>
            <div class="SelectMenu-list p-3">
              <form th:unless="${availableLabels.isEmpty()}" method="post" class="mb-3"
                    th:action="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/' + ${issue.number} + '/labels/add'}">
                <label class="f6 text-bold" for="labelName">Apply a label</label>
                <select id="labelName" name="labelName" class="form-select width-full mt-1 mb-2">
                  <option th:each="label : ${availableLabels}"
                          th:value="${label.name}" th:text="${label.name}">label</option>
                </select>
                <button type="submit" class="btn btn-sm btn-block">Apply</button>
              </form>

              <form th:action="@{'/' + ${owner} + '/' + ${repo.name} + '/labels/new'}" method="post">
                <label class="f6 text-bold" for="newLabelName">Create a new label</label>
                <input type="hidden" name="returnNumber" th:value="${issue.number}">
                <input type="text" id="newLabelName" name="name" class="form-control input-sm width-full mt-1 mb-2"
                       placeholder="Label name" required>
                <input type="text" name="description" class="form-control input-sm width-full mb-2"
                       placeholder="Description (optional)">
                <div class="d-flex gap-2">
                  <input type="color" name="color" value="#0969da" class="form-control input-sm color-swatch"
                         aria-label="Label colour">
                  <button type="submit" class="btn btn-sm flex-auto">Create</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </details>

      <div th:fragment="labelList" class="d-flex flex-wrap gap-1">
        <span th:each="label : ${attachedLabels}" class="d-inline-flex flex-items-center">
          <!-- Label colour comes from the repo's own palette, so it is inlined. -->
          <span class="Label" th:style="'background:' + ${label.color} + ';color:#fff'"
                th:text="${label.name}">label</span>
          <form method="post" class="d-inline-flex"
                th:action="@{'/' + ${owner} + '/' + ${repo.name} + '/issues/' + ${issue.number} + '/labels/remove'}">
            <input type="hidden" name="labelId" th:value="${label.id}">
            <button type="submit" class="btn-octicon btn-octicon-danger" aria-label="Remove label">
              <svg class="octicon" width="12" height="12" aria-hidden="true"><use href="#octicon-x"></use></svg>
            </button>
          </form>
        </span>
        <span th:if="${attachedLabels.isEmpty()}" class="color-fg-muted f6">None yet</span>
      </div>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
