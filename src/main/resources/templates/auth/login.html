<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Sign in')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main th:replace="~{fragments/layout :: page('auth', ~{::content})}">
  <th:block th:fragment="content">

    <div th:if="${param.logout}" class="flash flash-success">You have been signed out.</div>
    <div th:if="${param.error}" class="flash flash-error">Invalid username or password.</div>
    <div th:if="${success}" class="flash" th:text="${success}"></div>

    <div th:replace="~{fragments/form :: authCard('Sign in to GitKoo', null, @{/login},
                       ~{::fields}, 'Sign in',
                       'New to GitKoo?', @{/register}, 'Create an account')}">
      <th:block th:fragment="fields">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control width-full"
                 required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control width-full"
                 required autocomplete="current-password">
        </div>
      </th:block>
    </div>
  </th:block>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
