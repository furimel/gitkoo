<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Create account')}"></head>
<body>
<th:block th:replace="~{fragments/common :: header}"></th:block>

<main class="container-sm mt-6">
  <div class="text-center mb-4">
    <svg class="octicon" width="48" height="48" aria-hidden="true"><use href="#gitkoo-logo"></use></svg>
    <h1 class="f2 text-normal mt-3">Create your account</h1>
  </div>

  <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>

  <div class="Box Box--spacious">
    <div class="Box-body">
      <form th:action="@{/register}" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control width-full"
                 th:value="${username}" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control width-full"
                 th:value="${email}" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control width-full"
                 required minlength="8" autocomplete="new-password">
          <p class="note">Use at least 8 characters.</p>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control width-full"
                 required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>
  </div>

  <div class="Box mt-3 text-center">
    <div class="Box-body">
      Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
