<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head('Create account')}"></head>
<body>
  <header th:replace="~{fragments/common :: header}"></header>
  <div class="container-app">
    <div class="auth-card">
      <h1>Create account</h1>

      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <form th:action="@{/register}" method="post" class="mt-3">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="input"
                 th:value="${username}" required
                 placeholder="e.g. minh" autocomplete="username">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="input"
                 th:value="${email}" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="input"
                 required minlength="8" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="input"
                 required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-full">Create account</button>
      </form>

      <p class="text-sm text-muted mt-3 text-center">
        Already have an account? <a th:href="@{/login}">Sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
