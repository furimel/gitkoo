spring:
  application:
    name: gitkoo
  web:
    error:
      whitelabel:
        # Spring registers the whitelabel page as a View bean named, literally,
        # "error" - and BeanNameViewResolver runs ahead of the Inertia resolver, so
        # leaving it enabled means it wins the view name our own error page uses.
        # The key moved here in Boot 4; the old server.error.whitelabel path is
        # silently ignored, which looks exactly like the setting not working.
        enabled: false
  datasource:
    url: jdbc:sqlite:${gitkoo.data:./data}/gitkoo.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite is single-writer; keep the pool small to avoid "database is locked".
      maximum-pool-size: 1
      # Enable foreign keys so ON DELETE CASCADE works (DESIGN.md \u00a7116).
      connection-init-sql: PRAGMA foreign_keys = ON

server:
  port: 3000
  compression:
    # The client bundle and its stylesheets are the bulk of a first load.
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,application/json,image/svg+xml
    min-response-size: 2KB

gitkoo:
  # Root data directory. Everything GitKoo writes lives under here (design \u00a72.2).
  data: ./data
  git:
    binary: git
  ssh:
    enabled: true
    port: 2222
  ci:
    enabled: true
    workers: 2

logging:
  level:
    com.furimeo.gitkoo: INFO
