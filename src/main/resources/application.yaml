spring:
  application:
    name: gitkoo
  datasource:
    url: jdbc:sqlite:${gitkoo.data:./data}/gitkoo.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite is single-writer; keep the pool small to avoid "database is locked".
      maximum-pool-size: 1
      # Enable foreign keys so ON DELETE CASCADE works (DESIGN.md \u00a7116).
      connection-init-sql: PRAGMA foreign_keys = ON

server:
  port: 3000
  compression:
    # primer.css is ~745 KB uncompressed and ~90 KB gzipped. Worth the CPU.
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,image/svg+xml
    min-response-size: 2KB

gitkoo:
  # Root data directory. Everything GitKoo writes lives under here (design \u00a72.2).
  data: ./data
  git:
    binary: git
  ssh:
    enabled: true
    port: 2222
  ci:
    enabled: true
    workers: 2

logging:
  level:
    com.furimeo.gitkoo: INFO
