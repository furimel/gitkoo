plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.furimeo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.commonmark:commonmark:0.24.0'
	// GitHub-flavoured Markdown: tables, task lists, strikethrough, bare URLs.
	implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
	implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0'
	implementation 'org.commonmark:commonmark-ext-task-list-items:0.24.0'
	implementation 'org.commonmark:commonmark-ext-autolink:0.24.0'
	implementation 'org.jsoup:jsoup:1.19.1'
	implementation 'org.apache.sshd:sshd-core:2.15.0'
	runtimeOnly 'org.xerial:sqlite-jdbc'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/*
 * Builds the React client and packages it into the jar.
 *
 * Vite writes to build/frontend; this copies that into the jar's static resources
 * under app/, which WebMvcConfig serves at /assets/app/. Nothing generated is ever
 * written under src/, so a clean checkout has no build output in it.
 *
 * Node is required to build, and only to build. The jar that comes out is a single
 * self-contained file with the compiled bundle inside it - deploying GitKoo still
 * means copying one jar and running it.
 */
def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

/*
 * The dev server writes build/frontend-dev/hot while it is alive. When it is, the
 * Spring side proxies to it and never reads the packaged bundle, so building that
 * bundle would be a minute of work whose output nothing looks at - and `npm ci`
 * would delete node_modules out from under the running server. Skipping all three
 * tasks is what makes `./gradlew bootRun` a fast, Java-only restart during frontend
 * work.
 */
def viteIsHot = { -> layout.buildDirectory.file('frontend-dev/hot').get().asFile.exists() }

tasks.register('npmInstall', Exec) {
	description = 'Installs frontend dependencies.'
	workingDir = file('frontend')
	// The lock file is the real input; `npm ci` reads it, and reinstalling on every
	// unrelated build is minutes of nothing.
	inputs.file('frontend/package.json')
	inputs.file('frontend/package-lock.json')
	/*
	 * A stamp, not node_modules itself. Vite writes its dependency cache into
	 * node_modules/.vite, so declaring that directory as an output makes Gradle see
	 * it change every time the client runs - and re-run `npm ci`, which wipes
	 * node_modules while the dev server has files open in it. On Windows that fails
	 * outright with an access violation.
	 */
	def stamp = layout.buildDirectory.file('npm-install.stamp')
	outputs.file(stamp)
	// The stamp is not proof on its own: node_modules can be deleted by hand.
	outputs.upToDateWhen { file('frontend/node_modules').isDirectory() }
	onlyIf { !viteIsHot() }
	commandLine npmCommand, 'ci', '--no-audit', '--no-fund'
	doLast {
		def file = stamp.get().asFile
		file.parentFile.mkdirs()
		file.text = "installed from package-lock.json at ${new Date()}\n"
	}
}

tasks.register('npmBuild', Exec) {
	description = 'Type-checks and compiles the React client with Vite.'
	dependsOn 'npmInstall'
	workingDir = file('frontend')
	inputs.dir('frontend/src')
	inputs.file('frontend/package.json')
	inputs.file('frontend/vite.config.ts')
	inputs.file('frontend/tsconfig.json')
	outputs.dir(layout.buildDirectory.dir('frontend'))
	onlyIf { !viteIsHot() }
	commandLine npmCommand, 'run', 'build'
}

tasks.register('frontend', Copy) {
	description = 'Packages the compiled client into the jar resources.'
	dependsOn 'npmBuild'
	from layout.buildDirectory.dir('frontend')
	into layout.buildDirectory.dir('resources/main/static/app')
	onlyIf { !viteIsHot() }
}

// The client is part of the application, so it is built for anything that packages
// or runs one - and for tests, which assert the manifest is present and readable.
tasks.named('frontend') { mustRunAfter 'processResources' }
tasks.named('classes') { dependsOn 'frontend' }

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs('-Xmx512m')
	// src/test/resources/application.yaml points the tests at build/test-data.
	// Start from an empty one so a leftover database cannot decide the outcome:
	// a committed admin row made the setup tests fail with "Setup already completed".
	doFirst {
		delete layout.buildDirectory.dir('test-data')
	}
}
