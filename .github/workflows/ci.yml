name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The client is compiled into the jar, so CI needs Node to build at all.
      # The cache key is frontend/package-lock.json, which is why that file is
      # committed and why the Gradle task runs `npm ci` rather than `npm install`.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --console=plain

      - name: Build JAR
        run: ./gradlew bootJar --console=plain

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: gitkoo-jar
          path: build/libs/gitkoo-*.jar
          retention-days: 14
