name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --console=plain

      - name: Build JAR
        run: ./gradlew bootJar --console=plain

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: gitkoo-jar
          path: build/libs/gitkoo-*.jar
          retention-days: 14
