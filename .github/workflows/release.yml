name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: ./gradlew bootJar --console=plain

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GitKoo ${{ github.ref_name }}
          generate_release_notes: true
          files: build/libs/gitkoo-*.jar
          body: |
            ## Install

            ```bash
            java -jar gitkoo-${{ steps.version.outputs.VERSION }}.jar
            ```

            Open http://localhost:3000 and create your admin account.

            See [README](https://github.com/furimeo/gitkoo#quick-start) for details.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
